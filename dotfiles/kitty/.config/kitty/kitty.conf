# --- COLOR PALETTE (FIXES HARSH COLORS) ---

# Normal colors
color0  #282828
color1  #cc241d
color2  #98971a
color3  #d79921
color4  #458588
color5  #b16286
color6  #689d6a
color7  #ddc7a1

# Bright colors (softened, not neon)
color8  #928374
color9  #fb4934
color10 #b8bb26
color11 #fabd2f
color12 #83a598
color13 #d3869b
color14 #8ec07c
color15 #ebdbb2


font_size 12
foreground #e5e5e5
background #282828
background_opacity 0.9
background_blur 32

confirm_os_window_close 0

cursor #d79921
cursor_shape block
cursor_trail 1

shell zsh
shell_integration no-cursor

map ctrl+equal change_font_size all +2.0
map ctrl+minus change_font_size all -2.0
hide_window_decorations yes

macos_option_as_alt yes
macos_titlebar_color dark

window_padding_width 30

scrollbar_handle_opacity 0
scrollbar_track_opacity 0
scrollbar_track_hover_opacity 0

sync_to_monitor no

# BEGIN_KITTY_FONTS
font_family      family="0xProto Nerd Font Mono"
bold_font        auto
italic_font      auto
bold_italic_font auto
# END_KITTY_FONTS
################
### MONITORS ###
################

# See https://wiki.hypr.land/Configuring/Monitors/

# Your gaming monitor (Philips 272E1) pushed to its maximum 75Hz refresh rate
monitor = HDMI-A-2, 1920x1080@74.97, 0x0, 1

# Your secondary office monitor (AOC) positioned to the left of the gaming monitor
monitor = DP-2, 1920x1080@60.00, -1920x0, 1


###################
### MY PROGRAMS ###
###################

# Set programs that you use
$terminal = kitty
$fileManager = thunar
$menu = rofi -show drun

#############################
### ENVIRONMENT VARIABLES ###
#############################

# See https://wiki.hypr.land/Configuring/Environment-variables/

env = XCURSOR_SIZE,24
env = HYPRCURSOR_SIZE,24

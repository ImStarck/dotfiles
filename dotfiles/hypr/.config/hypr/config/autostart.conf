#################
### AUTOSTART ###
#################

# Autostart necessary processes (like notifications daemons, status bars, etc.)
# Or execute your favorite apps at launch like this:

# exec-once = $terminal
# exec-once = nm-applet &
# exec-once = waybar & hyprpaper & firefox

exec-once = hyprpolkitagent

#exec-once = awww-daemon
#exec-once = mpvpaper '*' ~/Pictures/wallpapers/animated/rivendell.mp4
#exec-once = gslapper -o "loop" '*' /home/agust/Pictures/wallpapers/animated/rivendell.mp4
exec-once = gslapper -o "loop" '*' ~/Pictures/wallpapers/animated/rivendell_1080p.mp4

exec-once = waybar

exec-once = swaync
exec-once = gnome-keyring-daemon --start --components=secrets
exec-once = systemctl --user start hyprpolkitagent

exec-once = gsettings set org.gnome.desktop.interface icon-theme "Papirus-Dark"
exec-once = gsettings set org.gnome.desktop.interface gtk-theme "gruvbox-dark-gtk"

exec-once = rivalcfg -C FF0D00 -c FF0D00 --left-strip-top-color FF0D00 --right-strip-top-color FF0D00 --left-strip-middle-top-color FF0D00 --right-strip-middle-top-color FF0D00 --left-strip-middle-bottom-color FF0D00 --right-strip-middle-bottom-color FF0D00 --left-strip-bottom-color FF0D00 --right-strip-bottom-color FF0D00
